<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="DA8N">
  <!--
    The DA8N mark: a heart with the 8 knocked out of it.

    DO NOT EDIT THIS FILE ALONE. The same artwork is built in
    `src/lib/mark.ts`, which `apple-icon.tsx` and `opengraph-image.tsx`
    rasterise through. `src/lib/mark.test.ts` asserts the two agree and fails
    if they drift, so a change here is a change there.

    The heart is the exact path from the sibling brand mark at
    `apps/d8n/web/public/brands/dateza-mark.svg` — DA8N wears the family's
    heart rather than a near-miss of it. DateZA is the heart alone; Date9ja is
    the heart with "9ja" knocked out; DA8N is the heart with its own character
    in it.

    Why not the 8 on its own, which is what this file used to be: an 8 in a
    rose square says "eight", not "dating". It placed the product in no
    category and connected it to none of its siblings.

    Why full-bleed rather than inside a rounded square: tested at 16/24/32/96.
    A square costs the heart ~20% of its height and the 8 shrinks with it,
    closing the counters below 32px so the 8 reads as a snowman. Full-bleed
    buys back exactly the room the 8 needs.

    The 8 sits high, centred near y 14 rather than on the heart's own centre.
    A heart tapers to a point, so an 8 placed by its own geometry pushes out
    through the bottom. It is fitted to the wide band, where Date9ja puts
    "9ja". Stroke 2.8/32 is ~1.4px at 16px, the floor before the rings grey
    out.
  -->
  <g transform="translate(-7.2727,-6.9818) scale(0.7273)">
    <path d="M32 53S10 39.6 10 24.8C10 16 16.8 10.2 24 10.2c3.4 0 6.4 1.4 8 3.61.6-2.2 4.6-3.6 8-3.6 7.2 0 14 5.8 14 14.6C54 39.6 32 53 32 53Z" fill="#ff4d6d"/>
  </g>
  <g fill="none" stroke="#fff7f8" stroke-width="2.8">
    <circle cx="16" cy="11.4" r="3"/>
    <circle cx="16" cy="16.6" r="3.7"/>
  </g>
</svg>
